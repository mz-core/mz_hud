<!DOCTYPE html>
<html lang="pt-BR" style="background: transparent !important; background-color: rgba(0,0,0,0) !important;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mz_hud</title>
  <link rel="stylesheet" href="shared/variables.css">
  <link rel="stylesheet" href="shared/animations.css">
  <link rel="stylesheet" href="shared/helpers.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hud/status/status.css">
  <link rel="stylesheet" href="hud/voice/voice.css">
  <link rel="stylesheet" href="hud/radio/radio.css">
  <link rel="stylesheet" href="hud/logo/logo.css">
  <link rel="stylesheet" href="hud/weapon/weapon.css">
  <link rel="stylesheet" href="hud/speedometer/speedometer.css">
  <link rel="stylesheet" href="hud/editor/editor.css">
</head>
<body class="hud-initializing" style="background: transparent !important; background-color: rgba(0,0,0,0) !important;">
  <div id="hud-root" class="hud-root">
    <div id="hud-logo" class="hud-logo hidden"></div>
    <div id="hud-container" class="hud-container"></div>
    <div id="speedometer" class="speedometer hidden"></div>
    <div id="weapon-hud" class="weapon-hud hidden"></div>
    <div id="medical-hud" class="medical-hud hidden" aria-live="polite"></div>
    <button id="editor-minimap-proxy" class="editor-minimap-proxy hidden" type="button" data-hud-select="minimap" aria-label="Preview do minimapa"><span class="minimap-proxy-grid"></span><strong>MAPA</strong><small>PREVIEW</small></button>
  </div>

  <div id="editor-overlay" class="visual-editor hidden" aria-label="Editor visual da HUD">
    <div id="editor-grid-guide" class="editor-grid-guide hidden" aria-hidden="true"></div>
    <div id="editor-safezone" class="editor-safezone hidden" aria-hidden="true"><span>ÁREA SEGURA DA HUD</span></div>
    <div id="editor-guide-x" class="editor-snap-guide guide-x hidden" aria-hidden="true"></div>
    <div id="editor-guide-y" class="editor-snap-guide guide-y hidden" aria-hidden="true"></div>

    <aside class="editor-navigator" aria-label="Elementos da HUD">
      <div><strong>MZ HUD</strong><span>Editor visual</span></div>
      <select id="editor-element-select" aria-label="Selecionar status"><option value="">Status...</option><option value="health">Vida</option><option value="armor">Colete</option><option value="hunger">Fome</option><option value="thirst">Sede</option><option value="stamina">Stamina</option><option value="oxygen">Oxigênio</option><option value="stress">Stress</option><option value="voice">Voz</option><option value="radio">Rádio</option></select>
      <button type="button" data-select-element="statusGroup">Status group</button>
      <button type="button" data-select-element="minimap">Mapa</button>
      <button type="button" data-select-element="speedometer">Velocímetro</button>
      <button type="button" data-select-element="weapon">Arma</button>
      <button type="button" data-select-element="logo">Logo</button>
    </aside>

    <div id="editor-selection-box" class="editor-selection-box hidden" aria-hidden="true">
      <div id="editor-context-toolbar" class="editor-context-toolbar">
        <span id="editor-selection-name">Elemento</span>
        <button type="button" data-editor-action="move" title="Mover">Mover</button>
        <button type="button" data-editor-action="inspect" title="Abrir inspector">Aparência</button>
        <button type="button" data-editor-action="toggle-lock" title="Bloquear ou desbloquear">Bloquear</button>
        <button type="button" data-editor-action="reset-element" title="Resetar elemento">Resetar</button>
      </div>
      <button id="editor-resize-handle" class="editor-resize-handle" type="button" title="Redimensionar" aria-label="Redimensionar elemento"></button>
    </div>

    <section id="editor-inspector" class="visual-inspector hidden" aria-label="Inspector de propriedades">
      <header>
        <div><small>INSPECTOR</small><strong id="inspector-title">Elemento</strong></div>
        <button id="inspector-close" type="button" title="Fechar inspector">x</button>
      </header>
      <div id="inspector-body" class="inspector-body"></div>
    </section>

    <div class="editor-dock" role="toolbar" aria-label="Ações globais">
      <div class="editor-brand"><strong>MZ HUD</strong><span id="editor-dirty-state">Sem alterações</span></div>
      <div class="dock-group">
        <button id="editor-undo" type="button" title="Desfazer (Ctrl+Z)" disabled>Undo</button>
        <button id="editor-redo" type="button" title="Refazer (Ctrl+Y)" disabled>Redo</button>
      </div>
      <div class="dock-group">
        <button id="editor-grid-toggle" type="button" aria-pressed="false" title="Mostrar grade">Grid</button>
        <button id="editor-snap-toggle" type="button" aria-pressed="true" title="Ativar snap">Snap</button>
        <button id="editor-safezone-toggle" type="button" aria-pressed="false" title="Mostrar safezone">Safe</button>
      </div>
      <label class="dock-select" title="Estado visual de preview"><span>Preview</span><select id="editor-preview-state"><option value="normal">Normal</option><option value="all">Todos</option><option value="vehicle">Veículo</option><option value="low">Baixo status</option><option value="submerged">Submerso</option></select></label>
      <button id="editor-presets-open" type="button" title="Abrir presets">Presets</button>
      <button id="reset-config" class="dock-danger" type="button" title="Resetar toda a HUD no draft">Resetar</button>
      <button id="save-config" class="dock-primary" type="button">Salvar e Aplicar</button>
      <button id="close-editor" type="button" title="Fechar editor">Fechar</button>
    </div>

    <div id="editor-preset-modal" class="editor-modal hidden" role="dialog" aria-modal="true" aria-labelledby="preset-modal-title">
      <div class="editor-modal-card preset-modal-card">
        <header><div><small>PRESETS</small><h2 id="preset-modal-title">Aplicar ao draft</h2></div><button type="button" data-modal-close="presets">x</button></header>
        <div class="preset-manager-head"><span id="preset-active-label">Atual: carregando...</span><span id="preset-backup-summary">Backups: carregando...</span></div>
        <div id="preset-manager-list" class="preset-manager-list"><div class="preset-empty-state">Carregando presets...</div></div>
        <p id="preset-manager-status" class="preset-manager-status" data-type="info">O preset só será persistido ao salvar.</p>
      </div>
    </div>

    <div id="editor-confirm-modal" class="editor-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="editor-modal-card confirm-card"><h2 id="confirm-title">Descartar alterações?</h2><p id="confirm-message">Existem alterações não salvas no draft.</p><div><button id="confirm-cancel" type="button">Continuar editando</button><button id="confirm-discard" class="dock-danger" type="button">Descartar alterações</button></div></div>
    </div>
  </div>

  <script src="core/constants.js"></script>
  <script src="core/utils.js"></script>
  <script src="core/positions.js"></script>
  <script src="core/icons.js"></script>
  <script src="hud/editor/schema.js"></script>
  <script src="hud/editor/visibility.js"></script>
  <script src="core/defaults.js"></script>
  <script src="core/weapons.js"></script>
  <script src="core/core.js"></script>
  <script src="hud/speedometer/speedometer.js"></script>
  <script src="hud/status/status.js"></script>
  <script src="hud/voice/voice.js"></script>
  <script src="hud/radio/radio.js"></script>
  <script src="hud/logo/logo.js"></script>
  <script src="hud/weapon/weapon.js"></script>
  <script src="hud/editor/store.js"></script>
  <script src="hud/editor/visual.js"></script>
  <script src="hud/editor/editor.js"></script>
  <script src="hud/editor/presets.js"></script>
  <script src="app/state.js"></script>
  <script src="app/nui.js"></script>
  <script src="app/render.js"></script>
  <script src="app/editor_bridge.js"></script>
  <script src="app/events.js"></script>
  <script src="app.js"></script>
</body>
</html>
